name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24  # type stripping runs the .ts tests directly
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Assets land at a stable URL that never needs bumping:
      # https://github.com/<repo>/releases/latest/download/<script>.user.js
      - name: release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ github.run_number }}"
          gh release create "$tag" dist/*.user.js \
            --title "$tag" \
            --notes "Built from ${{ github.sha }}." \
            --latest
